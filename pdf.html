    <!-- Theme is resolved before first paint so dark mode never flashes white -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var dark = saved ? saved === 'dark'
                    : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.classList.add('dark');
            } catch (e) { }
        })();
    </script>

    <!-- Reader: one slide at a time -->
    <main class="pdf-stage" id="stage" aria-roledescription="carousel" aria-label="Portfolio slides">
        <button type="button" class="pdf-nav pdf-nav--prev" id="prev" aria-label="Previous page" title="Previous (←)">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 4-6 6 6 6"/></svg>
        </button>
        <div class="pdf-frame">
            <figure class="pdf-slide" id="slide">
                <img id="slide-img"  alt="Page 1: Portfolio" width="2560" height="1440" />
                <div class="pdf-slide__links" id="slide-links"></div>
            </figure>
        </div>
        <button type="button" class="pdf-nav pdf-nav--next" id="next" aria-label="Next page" title="Next (→)">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 4 6 6-6 6"/></svg>
        </button>
    </main>

    <!-- Phones held upright read the deck as one scrolling column -->
    <section class="pdf-scroll" id="scroll" aria-label="Portfolio pages"></section>

    <footer class="pdf-foot">
        <div class="pdf-progress" id="progress" role="group" aria-label="Go to page"></div>
        <p class="pdf-hint"><kbd>←</kbd> <kbd>→</kbd> to turn pages · <kbd>G</kbd> all pages · <kbd>F</kbd> full screen</p>
    </footer>

    <!-- Speaker view: ?speaker, or press S -->
    <section class="pdf-speaker" id="speaker" aria-label="Speaker view" hidden>
        <div class="pdf-speaker__now">
            <p class="pdf-speaker__label">Now · <span id="sp-now-title"></span></p>
            <div class="pdf-frame"><figure class="pdf-slide"><img id="sp-now" alt="" width="2560" height="1440" /></figure></div>
            <div class="pdf-speaker__controls">
                <button type="button" class="menu-trigger" id="sp-prev">← Previous</button>
                <span class="pdf-counter" id="sp-counter"></span>
                <button type="button" class="menu-trigger" id="sp-next">Next →</button>
            </div>
        </div>
        <div class="pdf-speaker__side">
            <div class="pdf-speaker__clock">
                <div><span class="pdf-speaker__label">Elapsed</span><strong id="sp-timer">00:00</strong></div>
                <div><span class="pdf-speaker__label">Time</span><strong id="sp-clock">--:--</strong></div>
                <div class="pdf-speaker__timer-actions">
                    <button type="button" class="menu-trigger" id="sp-timer-toggle">Start</button>
                    <button type="button" class="menu-trigger" id="sp-timer-reset">Reset</button>
                </div>
            </div>
            <div>
                <p class="pdf-speaker__label">Next · <span id="sp-next-title"></span></p>
                <figure class="pdf-slide pdf-slide--small"><img id="sp-next-img" alt="" width="2560" height="1440" /></figure>
            </div>
            <label class="pdf-speaker__notes">

                <textarea id="sp-notes" placeholder="What do you want to say on this page?" spellcheck="true"></textarea>
            </label>
            <div class="pdf-speaker__actions">
                <button type="button" class="menu-trigger" id="sp-audience">Open audience window</button>
                <button type="button" class="menu-trigger" id="sp-export">Export notes</button>
                <label class="menu-trigger">Import notes<input type="file" id="sp-import" accept="application/json" hidden /></label>
                <a class="menu-trigger" href="./">Leave speaker view</a>
            </div>
        </div>
    </section>
