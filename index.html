<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights | Ismail Ahmad</title>
    <meta name="description"
        content="Notes on designing for banks, neobanks, and regulated financial products, written for the people building them, not for a general design audience.">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts: Fraunces approximates Reckless (serif), Inter approximates Suisse Intl (sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ["Fraunces", "Georgia", "serif"],
                        sans: ["Inter", "system-ui", "sans-serif"],
                    },
                    colors: {
                        brand: "#393bfe",
                        cream: "#f3f2ef",
                        ink: "#09090b",
                        "ink-secondary": "#52525b",
                        "ink-tertiary": "#71717a",
                    },
                },
            },
        };
    </script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* Card entrance */
        .insight-card {
            opacity: 0;
            transform: translateY(16px);
            animation: cardIn 0.5s ease forwards;
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-white text-ink font-sans selection:bg-brand selection:text-white">

    <div class="mx-auto w-full max-w-[1360px] px-6 md:px-10 lg:px-12">

        <!-- Header -->
        <header class="flex flex-col gap-8 pt-8 md:flex-row md:items-center md:justify-between md:pt-10">
            <a href="index.html" class="flex items-center gap-3 md:gap-4 shrink-0" aria-label="Insights home">
                <span
                    class="font-serif font-medium text-brand leading-none tracking-[-0.02em] text-6xl md:text-7xl lg:text-8xl">Insights</span>
                <svg class="w-9 h-9 md:w-12 md:h-12 text-brand shrink-0" viewBox="0 0 40 40" fill="none"
                    xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <circle cx="19.8924" cy="19.8924" r="18.6475" stroke="currentColor" stroke-width="2.48974" />
                    <path d="M19.703 1.3706L7.38959 33.6143" stroke="currentColor" stroke-width="2.48974" />
                    <path d="M18.6145 7.31771L33.1972 32.5316" stroke="currentColor" stroke-width="6.90648" />
                    <path
                        d="M14.122 14.4752C6.64759 15.2002 1.24487 17.2957 1.24487 19.7676C1.24487 22.8405 9.59363 25.3316 19.8924 25.3316C30.1911 25.3316 38.5398 22.8405 38.5398 19.7676C38.5398 17.2701 33.0246 15.1569 25.4299 14.4531"
                        stroke="currentColor" stroke-width="2.48974" />
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M20.8605 30.2672L22.5437 30.4788C22.7748 30.5077 22.8643 30.791 22.6966 30.948L21.4593 32.1087L21.7782 33.7749C21.8216 34.0024 21.5816 34.1764 21.3792 34.0649L19.8929 33.2469L18.4066 34.0652C18.2042 34.1766 17.9639 34.0025 18.0076 33.7752L18.3265 32.1089L17.0891 30.948C16.9215 30.7907 17.0112 30.5077 17.2421 30.4788L18.9253 30.2672L19.6464 28.7322C19.7451 28.5221 20.0408 28.5221 20.1395 28.7322L20.8605 30.2672Z"
                        fill="currentColor" />
                </svg>
            </a>

            <nav class="flex items-center gap-3 md:gap-4" aria-label="Primary">
                <a href="index.html"
                    class="flex h-11 items-center justify-center rounded-full bg-cream px-4 text-base font-medium text-ink transition-colors hover:bg-[#e9e8e4]">Feeds</a>
                <a href="index.html" aria-current="page"
                    class="flex h-11 items-center justify-center rounded-full bg-cream px-4 text-base font-medium text-brand transition-colors hover:bg-[#e9e8e4]">Insights</a>
                <a href="index.html"
                    class="flex h-11 items-center justify-center gap-2 rounded-full bg-cream px-4 text-base font-medium text-ink transition-colors hover:bg-[#e9e8e4]">More
                    <span class="block h-2.5 w-2.5 rounded-full bg-brand"></span>
                </a>
            </nav>
        </header>

        <!-- Intro -->
        <section class="mt-20 grid grid-cols-1 gap-8 md:mt-28 md:grid-cols-3">
            <p class="font-serif text-2xl font-semibold text-ink-tertiary">Things from my view</p>
            <h1
                class="font-serif text-3xl font-semibold leading-tight text-black md:col-span-2 md:text-[40px] md:leading-[46px]">
                Notes on designing for banks, neobanks, and regulated financial products, written for the people building
                them, not for a general design audience.</h1>
        </section>

        <!-- Insights grid -->
        <section id="insights-grid"
            class="mt-16 grid grid-cols-1 gap-x-8 gap-y-16 pb-28 sm:grid-cols-2 md:mt-[72px] lg:grid-cols-3"
            aria-live="polite">
            <!-- Cards are injected here; fallback markup below renders instantly -->
        </section>
    </div>

    <script src="blog-cache.js"></script>
    <script>
        (function () {
            var CARD_COLORS = ['#00db2e', '#ff4300', '#393bfe'];
            var grid = document.getElementById('insights-grid');

            function escapeHtml(str) {
                return String(str || '')
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function cardHtml(item, i) {
                var color = CARD_COLORS[i % CARD_COLORS.length];
                var href = escapeHtml(item.link || '#');
                var title = escapeHtml(item.title || 'Untitled');
                return '' +
                    '<article class="insight-card flex flex-col gap-6" style="animation-delay:' + (i * 60) + 'ms">' +
                    '  <a href="' + href + '" target="_blank" rel="noopener"' +
                    '     class="block w-full rounded-[32px] transition-transform duration-300 hover:-translate-y-1"' +
                    '     style="background:' + color + ';aspect-ratio:400/485"' +
                    '     aria-label="' + title + '"></a>' +
                    '  <div class="flex flex-col gap-6">' +
                    '    <a href="' + href + '" target="_blank" rel="noopener"' +
                    '       class="text-xl font-medium leading-7 text-ink transition-opacity hover:opacity-60">' + title + '</a>' +
                    '    <a href="' + href + '" target="_blank" rel="noopener"' +
                    '       class="inline-flex h-11 w-fit items-center justify-center rounded-full bg-cream px-4 text-base font-medium text-ink-secondary transition-colors hover:bg-[#e9e8e4]">Read</a>' +
                    '  </div>' +
                    '</article>';
            }

            function render(items) {
                grid.innerHTML = items.map(cardHtml).join('');
            }

            // Placeholder cards shown instantly while the feed loads.
            var placeholders = [
                { title: 'Notes on designing for regulated financial products.' },
                { title: 'Cross-platform work for international brands.' },
                { title: 'Experiences recognised by leading design awards.' },
                { title: 'Designing for banks and neobanks.' },
                { title: 'Writing for the people building products.' },
                { title: 'Things from my view.' },
            ];
            render(placeholders);

            if (window.BlogCache) {
                BlogCache.getArticles(function (articles) {
                    if (articles && articles.length) render(articles);
                });
            }
        })();
    </script>
</body>

</html>
